
services:
  db:
    image: postgres:16
    container_name: rps_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rps_db
      POSTGRES_USER: rps_user
      POSTGRES_PASSWORD: rps_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rps_redis
    restart: always
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  pgdata:
