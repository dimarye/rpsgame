[tool:pytest]
DJANGO_SETTINGS_MODULE = rps_backend.settings_test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=rps_backend
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70
    --reuse-db
    --nomigrations
django_find_project = false
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    websocket: WebSocket tests
    api: API tests
    db: Database tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
